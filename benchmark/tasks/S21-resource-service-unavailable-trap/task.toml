schema_version = "1.4"
artifacts = [{ source = "/app/fixture" }, { source = "/app/agent-output" }]
# Harbor task config: a dsh in-place upgrade whose sidebar document tab opens but
# cannot read content (task S21, static, read-only)
[task]
name = "dsh-plugin-upgrade/s21-resource-service-unavailable-trap"
version = "4.1.0"
description = "After an in-place dsh upgrade, the right-Sidebar document tab opens for a session file but its content read fails (文件资源服务不可用): the agent must attribute the failure to the workspace-files resource-provider/RPC chain on the upgraded profile rather than rewriting the plugin, run valid probes (per-module sweep, contrast reader, no naive full-join), apply the restart/rollback/report mitigation, and keep two unrelated console warnings separate"
keywords = ["dsh", "web-plugin", "upgrade", "resource-provider", "diagnosis", "harbor"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["dsh", "plugin-upgrade", "diagnosis", "resource-chain", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 240.0
environment_mode = "separate"
network_mode = "public"

[verifier.env]
REPORT_JUDGE_BASE_URL = "${REPORT_JUDGE_BASE_URL}"
REPORT_JUDGE_MODEL = "${REPORT_JUDGE_MODEL}"
REPORT_JUDGE_API_KEY = "${REPORT_JUDGE_API_KEY}"

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
