schema_version = "1.4"
# Harbor task 配置：dsh 插件迁移考题 H6-remote-error-trap（静态只读报告题）
[task]
name = "dsh-plugin-upgrade/h6-remote-error-trap"
version = "1.0.0"
description = "Migration report for an alpha.2 plugin still using 0.1.1 Remote error handling: migrate the error flow past a misleading comment trap that says keep the old code strings"
keywords = ["dsh", "plugin-migration", "static-analysis", "read-only", "harbor"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["dsh", "plugin-upgrade", "static-scan", "chinese-prompt"]

execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 120.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
