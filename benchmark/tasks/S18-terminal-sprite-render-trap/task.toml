# Harbor task config: terminal half-block sprite rendering defects and the
# dev-loop hang they rode in on (task S18, static, read-only)
[task]
name = "dsh-plugin-upgrade/s18-terminal-sprite-render-trap"
version = "1.1.0"
description = "A terminal pixel sprite (whale) shows phantom pixels at its right edges and ghost pixels surviving frame switches; flipping the animation feature default-on then hangs a CI job for its whole timeout - diagnose the half-block SGR background leak, the trailing-trim ghosting, the frame-data drift, the timer pinning, and write the prevention checklist"
