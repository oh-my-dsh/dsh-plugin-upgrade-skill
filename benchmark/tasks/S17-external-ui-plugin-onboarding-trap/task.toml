schema_version = "1.4"
# Harbor task config: onboarding a hand-written external web UI plugin onto a
# running web profile (task S17, static, read-only)
[task]
name = "dsh-plugin-upgrade/s17-external-ui-plugin-onboarding-trap"
version = "1.1.0"
description = "A hand-written external web UI plugin is inserted into a running web profile: the first boot kills EVERY plugin's registration with a misleading error naming an innocent first-awaited entry, the repackaged plugin then fails on a cross-entry slot declaration, and every edit requires a full host restart — diagnose all three layers from the evidence pack and write the onboarding protocol"
keywords = ["dsh", "web-plugin", "client-bundle", "slots", "onboarding", "harbor"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["dsh", "plugin-runtime", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
