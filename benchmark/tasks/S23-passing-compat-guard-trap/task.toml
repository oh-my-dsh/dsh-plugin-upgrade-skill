schema_version = "1.4"
artifacts = [{ source = "/app/fixture" }, { source = "/app/agent-output" }]
# Harbor task config: a compat-guarded plugin that silently no-ops after the
# dsh 0.1.6-alpha.2 multi-instance refactor (task S23, static, read-only)
[task]
name = "dsh-plugin-upgrade/s23-passing-compat-guard-trap"
version = "4.1.0"
description = "After an in-place dsh upgrade to 0.1.6-alpha.2, a composer input-recall plugin that ships a service-level compat guard (all four checks pass, no banner, no console error) silently stops responding: the agent must attribute the break to the removed sessions.list current field behind still-present services, derive the uiSession.current replacement from the sealed host type excerpts, write a dual-host migration with the session-scoped context, and harden the guard to probe fields instead of service presence"
keywords = ["dsh", "web-plugin", "upgrade", "multi-instance", "diagnosis", "harbor"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["dsh", "plugin-upgrade", "diagnosis", "compat-guard", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 240.0
environment_mode = "separate"
network_mode = "public"

[verifier.env]
REPORT_JUDGE_BASE_URL = "${REPORT_JUDGE_BASE_URL}"
REPORT_JUDGE_MODEL = "${REPORT_JUDGE_MODEL}"
REPORT_JUDGE_API_KEY = "${REPORT_JUDGE_API_KEY}"

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
