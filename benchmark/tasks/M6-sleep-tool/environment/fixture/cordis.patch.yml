# bench-sleep-tool bundle layer: inserts the plugin row.
# Distilled from @huanlin/dsh-plugin-sleep (exam material only).
# Defaults: max 60s per sleep, 0s default sleep (model must specify duration_ms).
- insert:
    - id: bench-sleep-tool
      name: '@bench/dsh-bench-sleep-tool'
      config:
        maxDurationMs: 60000
        defaultDurationMs: 0
