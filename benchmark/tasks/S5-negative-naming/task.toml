schema_version = "1.4"
# Harbor task 配置：dsh 插件迁移考题 S5-negative-naming（静态只读报告题）
[task]
name = "dsh-plugin-upgrade/s5-negative-naming"
version = "1.0.0"
description = "Read-only naming/registry judgment of a community plugin manifest: distinguish compatibility errors, collision recommendations, registry-context, and unknown states without over-claiming availability"
keywords = ["dsh", "plugin-migration", "static-analysis", "read-only", "harbor"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["dsh", "plugin-upgrade", "static-scan", "chinese-prompt"]

execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 120.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
