schema_version = "1.4"
# Harbor task 配置：dsh 插件迁移考题 M2-optional-dep-trap（容器冷启动实操题）
[task]
name = "dsh-plugin-upgrade/m2-optional-dep-trap"
version = "1.0.0"
description = "The plugin declares @deepseek-ai/dsh-util-time in optionalDependencies but unconditionally imports it at top level (the comment says optional is harmless): make the cold boot reliable on dsh 0.1.2-alpha.2"
keywords = ["dsh", "plugin-migration", "cold-boot", "harbor"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["dsh", "plugin-upgrade", "container-task", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
