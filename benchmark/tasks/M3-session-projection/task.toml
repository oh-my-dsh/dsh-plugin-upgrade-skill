schema_version = "1.4"
# Harbor task 配置：dsh 插件迁移考题 M3-session-projection（容器冷启动实操题）
[task]
name = "dsh-plugin-upgrade/m3-session-projection"
version = "1.0.0"
description = "A self-assembled profile mounts dsh-tool-todo without the sessionProjections service: cold boot leaves the entry pending (waiting for services: tools, sessionProjections) — fix the composition without editing the shipped package"
keywords = ["dsh", "plugin-migration", "cold-boot", "harbor"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["dsh", "plugin-upgrade", "container-task", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
