packages:
  - 'shared'
  - 'packages/*'
  - 'packages/skins/*'

# SDK peers 不自动安装，运行时由 DSH profile 树解析
# （原 true 只为聚合包发布时解析 peers，现已不需要）。
autoInstallPeers: false

allowBuilds:
  # The cloudflared postinstall downloads the platform binary (the auto-tunnel
  # feature ships its own tunnel client — users install nothing).
  cloudflared: true
  cpu-features: true
  esbuild: true
  node-pty: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@0.1.2-alpha.1'
  - '@deepseek-ai/dsh-agent@0.1.2-alpha.1'
  - '@deepseek-ai/dsh-api-remotes@0.1.2-alpha.1'
