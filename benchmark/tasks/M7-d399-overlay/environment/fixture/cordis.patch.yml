# bench-d399-overlay bundle layer: inserts the plugin row.
# (exam fixture, distilled from @huanlin/dsh-plugin-d399; game bodies elided)
# When the model is generating, a teaser pops up in the bottom-right corner;
# clicking the button opens the game menu (wordle / match-3, extensible via
# the d399Games client service).
- insert:
    - id: bench-d399-overlay
      name: '@bench/dsh-bench-d399-overlay'
      config:
        enabled: true
        message: '❤深❤夜❤寂❤寞❤，❤来❤玩❤ D399❤'
        buttonText: '来♂'
