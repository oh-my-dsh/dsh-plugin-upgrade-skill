# bench-workspace-ya bundle layer (exam fixture, distilled from
# @huanlin/dsh-plugin-ya-workspace-sidebar): the official ui-workspace client
# entry claims both sidebar.workspaces and conversation.hero.workspace, so the
# bundle disables it and the replacement provides both seats.
- id: ui-workspace
  disabled: true

- insert:
    - id: bench-workspace-ya
      name: '@bench/dsh-bench-workspace-ya'
