schema_version = "1.4"
artifacts = [{ source = "/app/fixture" }, { source = "/app/agent-output" }]
# Harbor task config: a client-plugin release that ships three interacting
# pitfalls (task S19, static, read-only)
[task]
name = "dsh-plugin-upgrade/s19-phantom-update-stale-host"
version = "4.1.0"
description = "A released client-plugin version triggers a phantom self-update badge (the client bundle baked the pre-bump version constant), the new SVG render route 404s while the client UI is updated (host-half routes register once at boot), and one broken image traces to a corrupted session read payload (source file is well-formed) — attribute all three from the evidence pack and design the defensive render chain and release checklist"
keywords = ["dsh", "web-plugin", "release", "build-order", "host-plane", "session-log", "harbor"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["dsh", "plugin-release", "render-pipeline", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 240.0
environment_mode = "separate"
network_mode = "public"

[verifier.env]
REPORT_JUDGE_BASE_URL = "${REPORT_JUDGE_BASE_URL}"
REPORT_JUDGE_MODEL = "${REPORT_JUDGE_MODEL}"
REPORT_JUDGE_API_KEY = "${REPORT_JUDGE_API_KEY}"

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
