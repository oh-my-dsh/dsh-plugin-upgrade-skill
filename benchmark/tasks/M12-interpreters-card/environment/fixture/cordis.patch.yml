# bench-interpreters-card bundle layer: inserts the plugin row.
# (exam fixture, distilled from @huanlin/dsh-plugin-interpreters; tool bodies elided)
# Defaults: python/node from PATH, 30s timeout.
- insert:
    - id: bench-interpreters-card
      name: '@bench/dsh-bench-interpreters-card'
      config:
        pythonPath: 'python'
        nodePath: 'node'
        timeoutMs: 30000
