schema_version = "1.4"
# Harbor task 配置：dsh 插件迁移考题 H5（settings 运行时导出漂移，hard 容器题）
[task]
name = "dsh-plugin-upgrade/h5-runtime-export-drift"
version = "1.1.0"
description = "Migrate a settings-seam plugin whose local build is green but whose packed install fails named-export resolution on dsh 0.1.2-alpha.2, without pinning old runtime or shimming"
keywords = ["dsh", "plugin-migration", "settings", "export-drift", "cold-boot", "harbor"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["dsh", "plugin-upgrade", "settings-seam", "runtime-drift", "chinese-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
