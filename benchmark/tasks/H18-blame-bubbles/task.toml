schema_version = "1.4"
# Harbor task config: dsh plugin migration exam H18 (host RPC contract + projection state map + client plane, in-container cold boot verification)
[task]
name = "dsh-plugin-upgrade/h18-blame-bubbles"
version = "1.1.0"
description = "Migrate a 0.1.2-era two-plane plugin to 0.1.2-alpha.2: the deleted gateway facade (RpcResult -> ConnectionRpcResult), the shrunken 2-arg rpc.handle contract, the projection register's dual-table state-map declaration, and a browser-roster activation proof"
keywords = ["dsh", "plugin-migration", "rpc", "connection-rpc", "session-projection", "client-plane", "cold-boot", "container", "harbor"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["dsh", "plugin-upgrade", "rpc-contract", "session-projection", "client-plane", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
