schema_version = "1.4"
# Harbor task 配置：dsh 插件迁移考题 H7（本地化文本锚定陷阱，容器冷启动）
[task]
name = "dsh-plugin-upgrade/h7-locale-trap"
version = "1.1.0"
description = "A web plugin anchors host UI by display text (/session\\s*log/i) which breaks silently once the host copy is localized: migrate the anchor to a stable data-slot and assert the injection rendered"
keywords = ["dsh", "plugin-migration", "locale", "web-client", "harbor"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["dsh", "plugin-upgrade", "container-task", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
