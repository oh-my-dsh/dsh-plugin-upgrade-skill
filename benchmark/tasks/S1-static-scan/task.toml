schema_version = "1.4"
# Harbor task 配置：dsh 插件迁移考题 S1（静态触点扫描，只读）
[task]
name = "dsh-plugin-upgrade/s1-static-scan"
version = "1.1.0"
description = "Read-only compatibility scan of a legacy dsh 0.1.1 plugin: map all seven touchpoint categories to upgrade cards without modifying the fixture"
keywords = ["dsh", "plugin-migration", "static-analysis", "compat-scan", "harbor"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["dsh", "plugin-upgrade", "static-scan", "chinese-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
