# bench-brand-text bundle layer: inserts the plugin row.
# (exam fixture, distilled from @huanlin/dsh-plugin-sidebar-brand-text; the
# settings card / slot component bodies are elided)
# Config:
#   name     — brand name text (default "DSH Local Build", the shell fallback)
#   revision — revision badge text; empty string hides the badge (default "")
- insert:
    - id: bench-brand-text
      name: '@bench/dsh-bench-brand-text'
      config:
        name: 'DSH Local Build'
        revision: ''
