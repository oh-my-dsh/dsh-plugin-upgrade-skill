schema_version = "1.4"
# Harbor task config: dsh plugin migration exam M8 (web UI slot plugin, snapshot-store engine move + inject recomposition, in-container web cold boot + browser roster)
[task]
name = "dsh-plugin-upgrade/m8-brand-text"
version = "1.1.0"
description = "Migrate a 0.1.0-rc.8-era web UI slot plugin to 0.1.2-alpha.2: snapshot-store engine moves to dsh-client-store, client inject recomposition, rc-suffix peer cohort rewrite, and an honest attribution of pre-existing test drift"
keywords = ["dsh", "plugin-migration", "client-store", "client-plane", "inject", "peer-cohort", "cold-boot", "container", "harbor"]

[metadata]
