schema_version = "1.4"
# Harbor task 配置：dsh 插件迁移考题 H3（客户端平面契约，容器冷启动验证）
[task]
name = "dsh-plugin-upgrade/h3-client-plane"
version = "1.0.0"
description = "Migrate a legacy dsh 0.1.1 browser plugin to 0.1.2-alpha.2 so it installs, activates, and appears in the web boot manifest entries"
keywords = ["dsh", "plugin-migration", "client-plane", "web-boot", "container", "harbor"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["dsh", "plugin-upgrade", "client-plane", "chinese-prompt"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
