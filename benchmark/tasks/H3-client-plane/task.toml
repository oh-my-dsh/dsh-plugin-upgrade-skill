schema_version = "1.4"
# Harbor task config: dsh plugin migration exam question H3 (client plane contract, in-container cold boot verification)
[task]
name = "dsh-plugin-upgrade/h3-client-plane"
version = "1.1.0"
description = "Migrate a legacy dsh 0.1.1 browser plugin to 0.1.2-alpha.2 so it installs, activates, and appears in the web boot manifest entries"
keywords = ["dsh", "plugin-migration", "client-plane", "web-boot", "container", "harbor"]

[metadata]
difficulty = "hard"
category = "programming"
tags = ["dsh", "plugin-upgrade", "client-plane", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
