schema_version = "1.4"
# Harbor task configuration: dsh plugin migration exam M1 (host plugin migration, basic container task)
[task]
name = "dsh-plugin-upgrade/m1-host-migration"
version = "1.1.0"
description = "Migrate a legacy dsh 0.1.1 host-plane plugin to 0.1.2-alpha.2 so it activates and reaches the host app layer on cold boot"
keywords = ["dsh", "plugin-migration", "host-plane", "cold-boot", "harbor"]

[metadata]
difficulty = "easy"
category = "programming"
tags = ["dsh", "plugin-upgrade", "host-migration", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
