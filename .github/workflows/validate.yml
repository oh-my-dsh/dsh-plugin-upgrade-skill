name: validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    steps:
      # Full history is required: the evaluation snapshot validator resolves
      # snapshot-pinned benchmark/skill commits via local git objects.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate skills, cards, and manifests
        run: npm test
      - name: Install pinned Claude Code validator
        if: matrix.node-version == 22
        run: npm install --global @anthropic-ai/claude-code@2.1.222
      - name: Validate Claude plugin marketplace
        if: matrix.node-version == 22
        run: claude plugin validate .
