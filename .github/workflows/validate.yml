name: validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills, cards, commands, and manifests
        run: npm test
      - name: Install pinned Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.222
      - name: Validate Claude plugin marketplace
        run: claude plugin validate .
